# TabbyAPI config for the exllamav3-exl3-5.05bpw profile. serve-exl3-5.05bpw.sh
# fills in the __VARIABLES__ and mounts the result as /app/config.yml.
network:
  host: 0.0.0.0
  port: 8000
  disable_auth: true
  api_servers: ["OAI"]
logging:
  log_prompt: false
  log_generation_params: false
model:
  model_dir: /app/models
  model_name: Qwen3.8-Flash-Next      # also the id /v1/models reports
  backend: exllamav3
  max_seq_len: __CTX__
  cache_size: __CTX__                  # tokens; shared by all running requests
  cache_mode: __CACHE_MODE__           # FP16, or "k_bits,v_bits" e.g. 8,8
  chunk_size: __CHUNK__
  max_batch_size: __MAX_SEQS__
  gpu_split_auto: true
  vision: true
  ngram_ram: true                      # the 6-bit n-gram (PLE) table in host RAM, not read from disk per token
  tool_format: qwen3_coder
  reasoning: true
  reasoning_start_token: "<think>"
  reasoning_end_token: "</think>"
sampling:
  override_preset: qwen38_flash_next   # sampler_overrides/qwen38_flash_next.yml
draft_model:
  draft_mode: __DRAFT_MODE__           # mtp or disabled
